name: Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Patch Android project
        run: node scripts/patch-android.mjs
      - name: Sync web assets
        run: npx cap sync android
      - name: Use fixed debug signing key
        run: |
          mkdir -p ~/.android
          if base64 -d native/android/debug.keystore.b64 > /tmp/ms-debug.keystore 2>/dev/null && keytool -list -keystore /tmp/ms-debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            cp /tmp/ms-debug.keystore ~/.android/debug.keystore
            echo "Using the fixed debug signing key"
          else
            echo "Fixed debug key missing or invalid - using a temporary key"
          fi
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketscope-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
